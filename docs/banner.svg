<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Gradiente: morado Kotlin → verde Android -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5e2eb8;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#7F52FF;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#3DDC84;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1fa463;stop-opacity:1" />
    </linearGradient>

    <!-- Gradiente del móvil -->
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0e7ff;stop-opacity:1" />
    </linearGradient>

    <!-- Patrón de puntos -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="300" fill="url(#bgGradient)" />
  <rect width="1200" height="300" fill="url(#dots)" />

  <!-- Círculos decorativos -->
  <circle cx="1080" cy="70" r="180" fill="#ffffff" opacity="0.06" />
  <circle cx="120" cy="260" r="140" fill="#ffffff" opacity="0.05" />

  <!-- Ícono del móvil -->
  <g transform="translate(80, 55)">
    <!-- Sombra -->
    <ellipse cx="65" cy="195" rx="55" ry="8" fill="#000000" opacity="0.2" />

    <!-- Cuerpo del móvil -->
    <rect x="15" y="0" width="100" height="185" rx="18" fill="url(#phoneGradient)" />

    <!-- Muesca superior -->
    <rect x="50" y="8" width="30" height="5" rx="2.5" fill="#7F52FF" opacity="0.5" />

    <!-- Pantalla -->
    <rect x="22" y="20" width="86" height="140" rx="4" fill="#7F52FF" opacity="0.15" />

    <!-- Check principal en pantalla -->
    <circle cx="65" cy="85" r="30" fill="#3DDC84" />
    <path d="M 50 85 L 60 95 L 82 72"
          stroke="#ffffff" stroke-width="6"
          fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Líneas de "lista" debajo -->
    <rect x="30" y="125" width="70" height="6" rx="3" fill="#7F52FF" opacity="0.3" />
    <rect x="30" y="137" width="50" height="6" rx="3" fill="#7F52FF" opacity="0.3" />

    <!-- Botón inferior -->
    <circle cx="65" cy="172" r="4" fill="#7F52FF" opacity="0.4" />

    <!-- Brillo lateral -->
    <rect x="20" y="30" width="4" height="120" rx="2" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Título principal -->
  <text x="280" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Asistencia Docentes
  </text>

  <!-- Subtítulo -->
  <text x="285" y="185" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="400" fill="#ffffff" opacity="0.9">
    App Android para control de asistencia en tiempo real
  </text>

  <!-- Badges de tecnologías -->
  <g transform="translate(285, 210)">
    <!-- Kotlin -->
    <rect x="0" y="0" width="80" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="40" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600"
          fill="#ffffff" text-anchor="middle">Kotlin</text>

    <!-- Jetpack Compose -->
    <rect x="90" y="0" width="150" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="165" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600"
          fill="#ffffff" text-anchor="middle">Jetpack Compose</text>

    <!-- Android -->
    <rect x="250" y="0" width="100" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="300" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600"
          fill="#ffffff" text-anchor="middle">Android</text>
  </g>
</svg>